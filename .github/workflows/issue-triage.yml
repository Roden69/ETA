name: Issue triage

# Deterministic first pass over new and edited issues. No checkout, no model, and
# no issue text in a shell: the script only reads the issue through the API and
# maintains one bot comment and two labels. See docs/ci-cd.md ("Issue-Bot").

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Pre-check issue
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Look for duplicates and check the repro checklist
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARKER = '<!-- eta-issue-triage -->';
            const LABELS = {
              'possible-duplicate': {
                color: 'fbca04',
                description: 'Issue-Bot: ähnliche Issues gefunden (automatische Vorprüfung).',
              },
              'needs-repro': {
                color: 'd93f0b',
                description: 'Issue-Bot: Angaben zum Nachstellen fehlen (automatische Vorprüfung).',
              },
            };
            // Words that carry no topic; German and English filler from the bug form.
            const STOPWORDS = new Set([
              'app', 'bug', 'eta', 'nicht', 'beim', 'wenn', 'oder', 'auch', 'immer', 'noch',
              'sich', 'eine', 'einen', 'einer', 'dass', 'wird', 'sind', 'kann', 'ist', 'der',
              'die', 'das', 'und', 'mit', 'für', 'von', 'auf', 'aus', 'bei', 'nach', 'über',
              'ohne', 'zum', 'zur', 'the', 'and', 'with',
            ]);

            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const number = issue.number;
            const body = issue.body ?? '';
            const labelNames = (issue.labels ?? []).map((label) => label.name);
            const isBug = labelNames.includes('bug');

            // Title words become search terms only; they are never run or echoed back.
            const title = (issue.title ?? '').replace(/^\[[^\]]*\]\s*/, '');
            const keywords = [...new Set(
              title.toLowerCase().split(/[^\p{L}\p{N}]+/u)
                .filter((word) => word.length >= 4 && !STOPWORDS.has(word)),
            )].slice(0, 5);

            // Open and closed issues alike. A hit needs two shared keywords in its
            // title, so one common word alone does not produce a "duplicate".
            let duplicates = [];
            if (keywords.length >= 2) {
              const { data } = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue in:title (${keywords.join(' OR ')})`,
                per_page: 20,
              });
              duplicates = data.items
                .filter((item) => item.number !== number)
                .filter((item) => {
                  const itemTitle = (item.title ?? '').toLowerCase();
                  return keywords.filter((word) => itemTitle.includes(word)).length >= 2;
                })
                .slice(0, 5);
            }

            // Issue forms render each answer under "### <label>"; "_No response_"
            // is what GitHub writes for an empty optional field.
            const sections = new Map(
              body.split(/^### /m).slice(1).map((part) => {
                const end = part.indexOf('\n');
                return end === -1 ? [part.trim(), ''] : [part.slice(0, end).trim(), part.slice(end + 1).trim()];
              }),
            );
            const isEmpty = (heading) => {
              const answer = sections.get(heading) ?? '';
              return answer === '' || answer === '_No response_';
            };
            const missing = isBug
              ? [
                ...(isEmpty('App-Version, Android-Version und Gerät')
                  ? ['App-Version, Android-Version und Gerät angeben']
                  : []),
                ...(isEmpty('Schritte zum Fehler')
                  ? ['Schritte zum Nachstellen beschreiben (1. … 2. … 3. …)']
                  : []),
              ]
              : [];

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const own = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.startsWith(MARKER),
            );

            if (duplicates.length > 0 || missing.length > 0 || own) {
              const lines = [
                MARKER,
                '### Vorprüfung durch den Issue-Bot',
                '',
                'Automatische Vorprüfung ohne Wertung. Der Bot schließt nichts und entscheidet nichts. Er hält diese eine Nachricht aktuell, wenn das Issue geändert wird.',
                '',
                '**Mögliche Dubletten**',
                ...(duplicates.length > 0
                  ? duplicates.map((item) => `- #${item.number} (${item.state === 'open' ? 'offen' : 'geschlossen'})`)
                  : ['Keine ähnlichen Issues gefunden.']),
              ];
              if (isBug) {
                lines.push('', '**Zum Nachstellen**');
                lines.push(...(missing.length > 0
                  ? missing.map((text) => `- [ ] ${text}`)
                  : ['Alle Angaben sind vorhanden.']));
                lines.push('', 'Ergänzungen direkt im Issue genügen; die Prüfung läuft danach erneut.');
              }
              const text = lines.join('\n');
              if (own) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: own.id, body: text });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: number, body: text });
              }
            }

            for (const [name, spec] of Object.entries(LABELS)) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: spec.color,
                  description: spec.description,
                });
              }
            }

            const wanted = {
              'possible-duplicate': duplicates.length > 0,
              'needs-repro': missing.length > 0,
            };
            for (const [name, on] of Object.entries(wanted)) {
              const present = labelNames.includes(name);
              if (on && !present) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [name] });
              } else if (!on && present) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
              }
            }

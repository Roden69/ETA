name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  debug:
    name: Debug validation
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Run debug validation
        run: bash ./gradlew --console=plain --stacktrace testDebugUnitTest lint assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload failure reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eta-debug-reports
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**/*.html
            app/build/reports/lint-results*.html
          if-no-files-found: ignore

  release-build:
    name: Signed release build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Build and verify signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing required secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing required secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing required secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing required secret ANDROID_KEY_PASSWORD}"

          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/eta-release.keystore"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo 'Decoded Android keystore is empty' >&2
            exit 1
          fi

          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"
          export ETA_RELEASE_VERSION="${RELEASE_TAG#v}"
          if ! bash ./gradlew --no-configuration-cache --console=plain testDebugUnitTest lint assembleRelease; then
            echo '::error::Release build failed. Check the Gradle output, signing secrets, and uploaded test/lint reports.'
            exit 1
          fi

          APK_PATH=app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Expected release APK was not produced: $APK_PATH" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK_PATH"
          mkdir release-artifact
          cp "$APK_PATH" "release-artifact/Eta-${RELEASE_TAG}.apk"
      - name: Upload signed release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eta-signed-release-${{ github.ref_name }}
          path: release-artifact/Eta-${{ github.ref_name }}.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload release failure reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eta-release-reports-${{ github.ref_name }}
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**/*.html
            app/build/reports/lint-results*.html
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eta-signed-release-${{ github.ref_name }}
          path: release-artifact
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$RELEASE_TAG" "release-artifact/Eta-${RELEASE_TAG}.apk"
          --verify-tag --generate-notes --title "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"

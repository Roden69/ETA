name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation validation and website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Check canonical documentation
        run: python scripts/documentation.py check
      - name: Check documentation tooling behavior
        run: python -m unittest discover -s scripts/tests -v
      - name: Report affected documentation
        if: github.event_name == 'pull_request'
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/documentation.py check --base "$BASE_REVISION" | tee documentation-review.txt
          {
            printf '### Documentation review targets\n\n```text\n'
            cat documentation-review.txt
            printf '\n```\n\nContent review and any no-change justification remain required.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build searchable documentation
        run: python scripts/documentation.py build
      - name: Upload documentation website
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eta-documentation
          path: build/documentation/site/
          if-no-files-found: error
          retention-days: 7
